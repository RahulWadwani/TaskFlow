<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — TaskFlow</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/static/css/forgot_pass.css">
</head>
<body>

<div class="background-glow glow-one"></div>
<div class="background-glow glow-two"></div>

<div class="auth-page">
  <div class="auth-card">

    <a href="/" class="auth-logo">
      <span class="logo-icon">✓</span>
      TaskFlow
    </a>

    <div class="auth-header">
      <h1>Forgot your password?</h1>
      <p>Enter your email and we'll send you a link to reset it.</p>
    </div>

    <div id="authErrorMsg" class="auth-error"></div>
    <div id="authSuccessMsg" class="auth-error" style="display: none; border-color: rgba(34,197,94,0.3); background: rgba(34,197,94,0.08); color: #86efac;"></div>

    <form id="forgotPasswordForm" class="auth-form">

      <div class="form-group">
        <label for="forgotEmail">Email</label>
        <input type="email" id="forgotEmail" placeholder="you@example.com" required>
      </div>

      <button type="submit" class="auth-submit-btn">Send reset link</button>

    </form>

    <div class="auth-footer">
      Remembered your password? <a href="/login">Back to log in</a>
    </div>

  </div>
</div>

<script src="/static/js/api.js"></script>
<script src="/static/js/auth.js"></script>

</body>
</html>
